# AgentHub 前端与反向代理。所属域：部署配置，不是业务代码。
#
# 安全要点：
# 1) 只监听 443 并启用 TLS，避免 API Key 以明文上行；
#    证书落在 /etc/nginx/certs（compose 命名卷 web_certs），由入口脚本按需自签，不进镜像。
# 2) 不再对外映射 80，避免宿主 8088 跳转到不带 8443 的 https://$host/...。
# 3) 反代保留 Authorization 头，同时补上常见的转发头，便于后端日志与限流定位。

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;

  # 只启用 TLS 1.2/1.3 与现代套件，去掉已知弱算法
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # 基础安全响应头；HSTS 仅在确认长期使用 HTTPS 后再放开 preload
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://server:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
