# AgentHub 前端与反向代理。所属域：部署配置，不是业务代码。
#
# 安全要点：
# 1) 默认监听 443 并启用 TLS，避免 API Key 在创建/更新时以明文上行；
#    证书与私钥从宿主机只读挂载到 /etc/nginx/certs，不进镜像。
# 2) 80 端口只做跳转到 443，不再提供明文服务。
# 3) 反代保留 Authorization 头，同时补上常见的转发头，便于后端日志与限流定位。

server {
  listen 80;
  server_name _;
  # 明文入口只做跳转，避免 Key 走 http
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  # 证书路径可用环境变量覆盖；默认挂载点见 docker-compose.yml
  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;

  # 只启用 TLS 1.2/1.3 与现代套件，去掉已知弱算法
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # 基础安全响应头；HSTS 仅在确认长期使用 HTTPS 后再放开 preload
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://server:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
