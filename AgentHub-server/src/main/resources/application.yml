server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: agenthub
  servlet:
    multipart:
      # 对话页「按住说话」上传整段录音。Spring Boot 默认单文件 1MB 会直接把语音拒掉；
      # 这里留到 12MB，服务端业务上限仍是 agenthub.runtime.voice.max-audio-bytes（默认 10MB）。
      max-file-size: 12MB
      max-request-size: 14MB
  profiles:
    # 默认 local 便于本机开发；生产用环境变量 SPRING_PROFILES_ACTIVE 覆盖。
    # 注意：application-local.yml 已从 src/main/resources 移出，放仓库外 AgentHub-server/config/，
    # 这样主密钥与库密码不会随 jar / 镜像分发。
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss.SSS
    serialization:
      write-dates-as-timestamps: false
  task:
    scheduling:
      # @Scheduled：空闲收口批抽、过期记忆清理、记忆向量补同步、billing 当日日汇总（每小时 10/30/50）。
      # 默认池只有 1 个线程，一次空闲批抽最长可能占用几分钟，会把清理和其它任务一起堵住；
      # 给到 3 个线程即可互不饿死，且不引入额外业务并发。
      pool:
        size: 3
  datasource:
    # 生产建议 useSSL=true 并配 truststore；库与后端同机/同网时可按需关闭。
    # 容器编排里库不对外暴露端口，链路不经公网。
    url: ${AGENTHUB_DB_URL:jdbc:mysql://127.0.0.1:3306/agenthub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${AGENTHUB_DB_USER:root}
    # 密码走环境变量 AGENTHUB_DB_PASSWORD 或仓库外的 config/application-local.yml，禁止写进本文件
    password: ${AGENTHUB_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  mapper-locations: classpath*:com/agenthub/**/mapper/*.xml

# Sa-Token 仍是单机会话。上面的 Redis 只给记忆和上下文窗口，不切 Token 存储
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  # timeout：绝对有效期（秒）。鉴权通过后由 SaTokenConfigurer 调用 renewTimeout 做滑动续期
  timeout: 1200
  # active-timeout：无操作失效（秒）。有鉴权请求时框架 autoRenew（默认 true）刷新活跃时间（滑动续期）
  active-timeout: 1200
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-cookie: false
  is-log: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

agenthub:
  workspace:
    # 会话级文件工具（workspaceWriteFile / ReadFile / ListFiles）的落盘根目录，每个会话在其下建一级子目录。
    # 默认 ./workspace-test：相对路径按进程工作目录解析（项目内），本地开发可直接查看落盘文件，该目录已 gitignore。
    # 显式留空（AGENTHUB_WORKSPACE_ROOT_PATH=）则回落到系统临时目录下的 agenthub_workspace，随系统清理。
    # 容器/生产用 AGENTHUB_WORKSPACE_ROOT_PATH 指向挂载的数据卷（见 docker-compose.yml），并留足配额。
    root-path: ${AGENTHUB_WORKSPACE_ROOT_PATH:./workspace-test}
  crypto:
    # 当前主密钥：32 字节，只从环境变量或仓库外 config/ 注入；为空启动即失败，禁止写真实密钥。
    # 新写入一律用它加密，密文带 v2 前缀与密钥指纹。
    secret-key: ${AGENTHUB_SECRET_KEY:}
    # 轮换过渡期的历史主密钥，逗号分隔；只用于解密旧密文。
    # 启动后 Credential/ToolSourceReencryptRunner 会自动重写旧密文，迁移完成后即可移除。
    previous-keys: ${AGENTHUB_PREVIOUS_SECRET_KEYS:}
  model:
    http:
      connect-timeout-ms: 3000
      read-timeout-ms: 15000
      # 语音识别 / 合成出站的读超时。合成整段回答比探活慢，沿用 15 秒会误判成失败
      speech-timeout-ms: ${AGENTHUB_MODEL_SPEECH_TIMEOUT_MS:60000}
  tool:
    mcp:
      # tools/list 的连接与读取上限，避免同步占住控制台请求
      connect-timeout-ms: 3000
      read-timeout-ms: 15000
  workflow:
    # WF-P0 刀3 硬顶（生效值都会夹紧，写错不会变成无上限）：
    # 单次调度的墙钟上限（毫秒）。HUMAN 等待不计入，人工卡点由节点 timeoutPolicy 兜底。
    wall-ms: ${AGENTHUB_WORKFLOW_WALL_MS:60000}
    # 旧键兼容（刀2）：wall-ms<=0 时回落到这里；新部署只配 wall-ms 即可。
    trial-wall-ms: 60000
    # HUMAN 节点未配 timeoutMs 时的兜底等待时长（毫秒），默认 24 小时。
    human-default-timeout-ms: 86400000
    # 单个 PARALLEL_FORK 允许的分支数（不含 ERROR 边）；超出即失败该 FORK。
    max-parallel-branches: 3
    # 校验 / 发布允许的单图节点数。
    max-nodes-per-graph: 500
    # 单次 run 允许预建的 node_run 条数。
    max-node-runs-per-run: 500
  runtime:
    # 试跑 SSE 出站。正文增量（assistant / reasoning）按「时间窗 + 单帧字节」双上限合批，
    # 只改帧数，不改事件名 / 字段 / 顺序；控制帧（phase / route / tool / plan / step / done…）
    # 写出前会先 flush，收尾与取消路径也强制 flush，不丢尾字。
    sse:
      # 时间窗（毫秒）。默认 50，有效范围 1~1000；写 0 或负数回落默认
      batch-window-ms: ${AGENTHUB_SSE_BATCH_WINDOW_MS:50}
      # 单帧正文上限（UTF-8 字节）。默认 2048（中文约 680 字），有效范围 1~65536
      batch-max-bytes: ${AGENTHUB_SSE_BATCH_MAX_BYTES:2048}
    voice:
      # 单段录音体积上限（字节）。默认 10MB，约等于 60 秒 webm/opus；
      # 与 spring.servlet.multipart.max-file-size（12MB）配合：先由业务闸门给人话文案，再由容器兜底。
      max-audio-bytes: ${AGENTHUB_VOICE_MAX_AUDIO_BYTES:10485760}
      # 单次语音合成的文字上限（字符）。超限明确报错，前端改用浏览器朗读（无字符上限）。
      max-speech-chars: ${AGENTHUB_VOICE_MAX_SPEECH_CHARS:4000}
    # 平台硬顶 + 默认。Agent 列可空覆盖；空=跟 default；保存必须 ≤ max；生效 min(覆盖或default, max)
    limits:
      timeout-ms:
        default: 120000
        max: 300000
      max-rounds:
        default: 8
        max: 32
      tool-timeout-ms:
        default: 30000
        max: 120000
      tool-max-retries:
        default: 0
        max: 3
      max-tool-calls:
        default: 32
        max: 64
      llm-timeout-ms:
        default: 60000
        max: 120000
      max-llm-calls:
        default: 32
        max: 64
      consecutive-fail-abort:
        default: 3
        max: 10
      tool-result-max-chars:
        default: 8000
        max: 32000
    trial:
      # content_text 单条上限（字符）。超出截断并注明已截断
      content-limit-chars: 32768
      # 历史会话的「默认页大小」：仅当请求没传 size 时生效，不再是任意请求的硬顶。
      # 真分页由前端 current++ 触底加载；单页上限仍是全站 100（PageQuery.MAX_SIZE）。
      history-limit: 50
      # 首轮对话结束后是否异步生成会话标题（≤10 汉字）。关掉则左栏只显示首问预览；
      # 生成任务跑在 common 的 lightTaskExecutor 上，失败只记日志，不影响试跑。
      auto-title-enabled: ${AGENTHUB_AUTO_TITLE_ENABLED:true}
      # 超长工具结果落盘阈值（字符）。超过即写入会话工作区，对话里只留「摘要 + 路径」，
      # 模型需要细节再调 workspaceReadFile 分段读。0 或负数 = 关闭句柄化（退回纯字符截断）。
      tool-result-offload-chars: 2000
      # 落盘结果回灌时保留的头部摘要字符数：标题/状态/表头都在前几百字
      tool-result-offload-preview-chars: 600
    # 工具必填参数闸门：缺必填不得脑补。补参只看本轮提问、本会话上下文、本轮已注入长期记忆
    tool-args:
      # 默认硬拦。仅排障时临时关闭，关闭后回到「只靠提示词」的旧行为
      enabled: true
      # 这些参数有值但三档来源都无依据时按编造拦下；留空用内置默认（city/place/location/address/timezone 等）
      entity-param-names: []
      # 这些事实键对应的必填参数同样做依据校验；留空用内置默认（residence_city/timezone）
      entity-fact-keys: []
  agent:
    # 平台安全前缀来自 classpath 资源，运行时拼到用户段前面，不写入 agent_def.system_prompt
    prompt-prefix-enabled: true
    prompt-prefix-path: classpath:prompt/platform-prefix-zh.txt
    prompt-router-extra-path: classpath:prompt/platform-prefix-router-zh.txt
    # 用户业务段上限，按 Java char（UTF-16 码元）。绝对上限与 AgentChecks.PROMPT_MAX 一致
    prompt-max-chars: 12000
    # 覆盖系统规则、外连诱导默认只告警仍可保存；改为 true 则一并拒绝
    prompt-warn-as-error: false
  prompt:
    # 绑定个数硬顶。保存时超出直接拒绝
    max-tools-per-agent: 16
    max-skills-per-agent: 8
    # ROUTER 父节点超过该数仍可保存，但响应里带警告
    router-warn-tools: 2
    router-warn-skills: 2
    # ---- 运行时注入预算：**只有这一套**，统一由 PromptBudgetTrimmer 按优先级让出 ----
    # 历史上有两把剪刀（assembler.max-chars 与本节的 system-prompt-max-chars），
    # 现已合并：assembler.max-chars 只作为「单次组装正文的绝对安全阀」，不再承担业务预算。
    # 各配置大于对应 cap 时按 cap 生效。
    # 工具完整 JSON Schema 专款（走模型请求的 tools 字段，不进 system 文案）
    tools-schema-max-chars: 8000
    tools-schema-max-chars-cap: 16000
    # 按需 Skill 额度：标题 + 场景 + 正文
    skills-inject-max-chars: 4000
    skills-inject-max-chars-cap: 16000
    # 按需 Skill 是否把正文也灌进系统提示。默认 false：只给「标题 + 场景」。
    # 这是 P0 预算收敛的主要来源——旧实现按剩余额度贪心把 8 条正文全灌进 system，
    # 单 Skill 段能吃掉五千多字，而模型判断「该不该用」只需标题 + 场景。
    # 仅当确认「模型必须看到正文才会正确套用」时开到 true，开启后 token 会明显回升。
    on-demand-skill-body-enabled: false
    # 单条强制 Skill 块硬上限；超限截断正文并打标（段头与固定前缀不裁）
    forced-skill-max-chars: 1800
    forced-skill-max-chars-cap: 8000
    # 系统提示总预算。保护区（L1 + 平台追加句 + 锁定段）永不裁剪，实际可能略超
    system-prompt-max-chars: 12000
    system-prompt-max-chars-cap: 24000
    # 提示词组装门面（L1 → L2 → L3 → 一次性变量替换）
    assembler:
      # 关闭后不再拼接 L1 平台约束。仅排障用：关闭等于失去平台红线，生产必须为 true。
      # 开启时「无生效 L1」会阻断出站，不允许退回 classpath 文案。
      constraint-enabled: true
      # 请求未指定语言时的回落；L1/L2 都按它取生效版
      default-locale: zh-CN
    # 说明：组装层不再有自己的字符预算。系统提示的唯一预算在下面 prompt 段——
    #   system-prompt-max-chars（总量）/ skills-inject-max-chars（按需 Skill）
    #   / forced-skill-max-chars（单条强制 Skill）/ tools-schema-max-chars（tools 字段）
    # 由 PromptBudgetTrimmer 按「记忆 → 按需 Skill → 目录文案 → 可压区 → 强制 Skill」一次让出。
    # 已删除的旧配置：agenthub.prompt.assembler.max-chars（曾与上面那套打架，双截断）。
    # L1/L2 缓存：Caffeine（进程内）→ Redis → DB；发布后显式失效
    cache:
      # 进程内条目上限。配置态数据量小，512 足够
      local-max-size: 512
      # 进程内 TTL（秒）。发布时会主动失效，这里只是兜底
      local-ttl-sec: 60
      # Redis TTL（秒）。多实例共享
      redis-ttl-sec: 600
      # 「确认不存在」的负缓存（秒）。很短，避免配置缺失打穿 DB 又能快速自愈
      miss-ttl-sec: 10
  memory:
    # 策略未填或没有策略行时的默认；保存值必须 ≤ 对应 max
    short-default-ttl-sec: 86400
    short-default-ttl-max-sec: 604800
    # 近轮滑动窗：条数 + 字符双上限，先到哪个算哪个。
    # 从 20 轮 / 32000 字收紧到 12 轮 / 16000 字：更早的内容已由滚动摘要覆盖，
    # 而摘要与近轮已做去重（同一段不会被写两遍）。
    ctx-max-turns: 12
    ctx-max-turns-cap: 50
    ctx-max-chars: 16000
    ctx-max-chars-cap: 64000
    # 无策略行时的默认空闲秒数；策略页可改（最小 60）。同一列同时用于：
    #   1) 上下文窗口 Redis TTL；2) 空闲多久后收口会话并批抽 LONG（调度读策略，不写死本值）
    ctx-idle-ttl-sec: 7200
    ctx-idle-ttl-max-sec: 86400
    # 注入进提示词的记忆正文上限，和窗口字符分开计
    recall-max-chars: 4000
    # LONG 注入条数 Top N：importance 降序、再按 update_time 新近排序后取前 N。
    # 默认 5；硬顶 recall-long-top-n-cap=20。只影响「注入多少条」，不删库内条目。
    recall-long-top-n: 5
    recall-long-top-n-cap: 20
    # 召回 importance 下限（0~100）。默认 0 = 不过滤；越界钳制到 [0,100]。
    # 向量路径与 MySQL 降级路径共用同一门槛：低于下限的条目先丢弃，再截 Top N。
    recall-importance-min: ${AGENTHUB_MEMORY_RECALL_IMPORTANCE_MIN:0}
    # 召回近义去重开关。默认 false = 与未上线该能力时行为完全一致；只影响注入，不删库、不合并 fact_key。
    recall-near-dup-enabled: ${AGENTHUB_MEMORY_RECALL_NEAR_DUP_ENABLED:false}
    # 近义去重阈值（0~1），默认 0.92；越界钳制到 [0,1]。
    # 向量路径按正文相似度判近义；MySQL-only 路径没有向量分，改用正文规范化指纹判等。
    recall-near-dup-similarity: ${AGENTHUB_MEMORY_RECALL_NEAR_DUP_SIMILARITY:0.92}
    # 记忆专用 Milvus collection（与 RAG 的 agenthub_kb_* 物理分离，禁止混用）
    # 必须落在 agenthub_memory_ 命名空间，否则记忆向量 isReady=false（只日志，不阻塞启动）
    milvus-collection: ${AGENTHUB_MEMORY_MILVUS_COLLECTION:agenthub_memory_long}
    # 记忆向量维度：仅作排障对照，**不参与 ensure / 写入**。真正维度取平台级 Embedding
    # 最近一次连通测试成功快照 model_instance.embedding_dim；快照缺失则记忆向量 isReady=false。
    embedding-dimension: ${AGENTHUB_MEMORY_EMBEDDING_DIMENSION:768}
    # 平台级 Embedding / Rerank 解析结果短缓存毫秒数。设置/换绑/连通测试快照更新时主动失效；
    # 本 TTL 只兜「绕过模型中心直接改库」的场景，避免每次召回都查 model_instance。
    platform-model-cache-ms: ${AGENTHUB_MEMORY_PLATFORM_CACHE_MS:30000}
    # 向量双写（Embedding + Milvus upsert）失败重试：次数含首次，退避毫秒；耗尽只日志，不回滚 MySQL
    vector-write-max-attempts: ${AGENTHUB_MEMORY_VECTOR_MAX_ATTEMPTS:3}
    vector-write-retry-backoff-ms: ${AGENTHUB_MEMORY_VECTOR_RETRY_BACKOFF_MS:200}
    # 召回（LONG）：Milvus 候选条数、Embedding / Rerank 单次等待上限、单轮尝试次数。
    # 超时或失败一律降级 MySQL Top N；默认 attempts=1 即每轮每类出站最多一次（配置最多 2 = 一次短重试）
    recall-vector-top-k: ${AGENTHUB_MEMORY_RECALL_TOP_K:20}
    recall-vector-timeout-ms: ${AGENTHUB_MEMORY_RECALL_TIMEOUT_MS:2500}
    recall-rerank-timeout-ms: ${AGENTHUB_MEMORY_RECALL_RERANK_TIMEOUT_MS:2500}
    recall-vector-max-attempts: ${AGENTHUB_MEMORY_RECALL_MAX_ATTEMPTS:1}
    # 存量补同步（刀5）：单轮最多推进条数、允许的最大失败次数。
    # 手动入口：POST /api/memory/vector/reconcile；失败达到上限后停在 FAILED 只打日志。
    vector-reconcile-batch-limit: ${AGENTHUB_MEMORY_RECONCILE_BATCH:200}
    vector-reconcile-max-fail-count: ${AGENTHUB_MEMORY_RECONCILE_MAX_FAIL:3}
    # 存量补同步的应用内定时（刀6）。默认 false：补同步会真出站，不默认自动跑。
    # 打开后按 vector-reconcile-delay-ms（fixedDelay，默认 30 分钟）推进一轮；与手动接口共用同一 runOnce()，
    # 已就绪判定 / 并发 CAS / 单轮 ≤200 / fail_count<3 全部复用，不做启动全量。
    vector-reconcile-schedule-enabled: ${AGENTHUB_MEMORY_RECONCILE_SCHEDULE_ENABLED:false}
    vector-reconcile-delay-ms: ${AGENTHUB_MEMORY_RECONCILE_DELAY_MS:1800000}
    # 受控重建未完成期间的自动续补（默认开）：重建是操作者显式确认过的一次性动作，
    # 剩余存量由服务端按短间隔继续推进，页面刷新 / 切菜单都不打断，不需要人反复点「继续补同步」。
    # 与上面的全局补同步定时分开：全局仍默认关，避免装好就开始烧配额。
    vector-rebuild-drain-enabled: ${AGENTHUB_MEMORY_REBUILD_DRAIN_ENABLED:true}
    # 自动续补轮询间隔（毫秒）。只在该进程持有「重建未完成」标记时生效，空闲期一次库都不查
    vector-rebuild-drain-delay-ms: ${AGENTHUB_MEMORY_REBUILD_DRAIN_DELAY_MS:3000}
    # 单轮零进展时的退避上限（毫秒）：Embedding 故障/未就绪时指数退避到该值，有进展立刻回到基础间隔
    vector-rebuild-drain-max-backoff-ms: ${AGENTHUB_MEMORY_REBUILD_DRAIN_MAX_BACKOFF_MS:30000}
    # 策略、绑定、平台 SUMMARY 都空时才用。空字符串表示不兜底
    summary-fallback-instance-id: ${AGENTHUB_SUMMARY_MODEL_ID:}
    # MEMORY 抽取环境兜底；与 SUMMARY 分离，不共用
    memory-fallback-instance-id: ${AGENTHUB_MEMORY_MODEL_ID:}
    cleanup-delay-ms: 3600000
    # 过期清理（刀8）：单轮最多处理行数。过期满批后下一轮继续（按 id 升序，进度单调）；
    # 过期行本就被读路径过滤，短暂积压只影响表大小。一次删几十万行会长时间持锁并把海量主键塞给向量删除。
    expired-purge-batch-limit: ${AGENTHUB_MEMORY_EXPIRED_PURGE_BATCH:2000}
    # 单次向量删除请求的主键上限。超过则拆批串行发送，避免一次过期清理打爆 Milvus/网关。
    vector-delete-batch-limit: ${AGENTHUB_MEMORY_VECTOR_DELETE_BATCH:500}
    # 空闲批抽定时扫描间隔（fixedDelay）；首轮延迟默认 1 小时（3600000），避免生产重启后立刻打库/出站。
    # 本地想快速观测首轮扫描，用 application-local.yml 或环境变量
    #   AGENTHUB_MEMORY_SESSION_CLOSE_INITIAL_DELAY_MS=30000
    # 覆盖即可，不要把默认值改回 30 秒：默认配置会随发布走，重启即批抽不可接受。
    # 到期判定不读这里：读每个 Agent 策略的 ctx_idle_ttl_sec（默认 7200、最小 60）
    session-close-delay-ms: 60000
    session-close-initial-delay-ms: 3600000
    # 批抽出站总闸（session_end / summary）。随仓默认 true = 允许出站批抽；
    # 生产止血时用环境变量 AGENTHUB_MEMORY_LONG_EXTRACT_BATCH_ENABLED=false 关死（代码兜底默认仍是 false）。
    # 关着时策略开关打开也会 skip，幂等表记 reason=batch_kill_switch，之后不会补抽；
    # explicit「记住」走独立通道，不受本开关影响。
    long-extract-batch-enabled: true
    # 单次 CloseJob 最多收口+批抽的空闲会话数（串行）
    session-close-batch-limit: 5
    # 会话级批抽最短正文；更短则 skip 不调模型
    long-extract-min-chars: 32
    # 两次批抽间隔毫秒；0=不额外 sleep
    long-extract-interval-ms: 200
    # LONG fact_key 同义扩展（别名 → 规范键）。内置已含居住/城市类与饮食/饮品偏好族
    # （food_preference / favorite_food / 饮食偏好 → food_preference；favorite_drink / 喜爱饮品 → beverage_preference），
    # 同族写入库会合并成一条。此处只追加业务私有别名；同名覆盖内置。
    fact-key-aliases: {}
    # L0 显式「记住」正则（find 匹配）。留空=用代码内置默认：
    #   记住 / 请记住 / 帮我记住 / 以后默认 / 以后都按 / 记一下 / 帮我记着 / 别忘了 / 存一下
    # 配置后整体替换默认；仅作用于用户当轮原文的显式通道，不影响会话结束/摘要批抽。
    remember-patterns: []
  rag:
    # 一期①只做知识库建库与 Collection 初始化；②入库 ③检索 ④Agent 绑定后排
    milvus:
      # 本机 Milvus（Lite / standalone 同一 gRPC 端口）。未启动不影响应用启动，
      # 只在建库/重建或检索时连接失败：管理员侧记地址便于排障，对话侧由工具边界换成用户话术
      uri: ${AGENTHUB_MILVUS_URI:http://127.0.0.1:19530}
      # 鉴权 token（user:password 或 API Key）；本机 Lite 留空。禁止把真实凭证写进本文件
      token: ${AGENTHUB_MILVUS_TOKEN:}
      # 默认 database；空表示 default
      database: ${AGENTHUB_MILVUS_DATABASE:}
      connect-timeout-ms: 5000
      # 建集后同步加载集合的上限。SDK 单位是毫秒，误传秒会立刻 Load timeout
      load-timeout-ms: 15000
      # 是否尝试建 dense+BM25 集合。Milvus Lite 不支持 sparse 会自动降级为纯向量，
      # 降级结果写入 rag_knowledge_base.store_capability=DENSE_ONLY
      bm25-enabled: ${AGENTHUB_RAG_BM25_ENABLED:true}
    # 原文落盘根目录。相对路径按进程工作目录解析，默认 ./data/rag（项目内），不新建盘符目录。
    # 按 kbId/docId 分子目录，文件名只保留扩展名，因此不存在路径穿越。
    storage:
      dir: ${AGENTHUB_RAG_STORAGE_DIR:./data/rag}
    embedding:
      # 向量化出站读超时。比 chat 慢：批量 16 条可能秒级到十秒级
      read-timeout-ms: ${AGENTHUB_RAG_EMBEDDING_TIMEOUT_MS:30000}
    rerank:
      # 文本排序出站读超时（DASHSCOPE text-rerank）
      read-timeout-ms: ${AGENTHUB_RAG_RERANK_TIMEOUT_MS:30000}
    # 文档解析：默认本地；MinerU/Vision 可选，无 Key 跳过不炸
    parse:
      engine: ${AGENTHUB_RAG_PARSE_ENGINE:local}
      mineru:
        enabled: ${AGENTHUB_RAG_MINERU_ENABLED:false}
        fallback-local: true
        api-key: ${AGENTHUB_MINERU_API_KEY:}
        types: pdf,docx,png,jpg,jpeg,gif,webp
      vision:
        enabled: ${AGENTHUB_RAG_VISION_ENABLED:false}
        api-key: ${AGENTHUB_VISION_API_KEY:}
        pdf-sparse-chars-per-page: 40
        pdf-max-ocr-pages: 15
    ingest:
      # 领域噪声过滤（含历史茶饮规则）；默认关，避免硬编码语料
      domain-noise-filter: false
  eval:
    # 评测域。一期 sys_user 无 tenant_id，先用配置指定「当前租户」；
    # 0 保留给平台只读样例，配成 0 会被实现兜底成 1，避免把租户数据写进只读区。
    current-tenant-id: ${AGENTHUB_EVAL_TENANT_ID:1}
    samples:
      # 平台内置冒烟套件；缺失不影响启动，只在「导入样例」接口调用时报明确错误
      location: ${AGENTHUB_EVAL_SAMPLES_LOCATION:classpath:eval/samples/platform-smoke-suite.json}
    # 跑批：串行、保守超时
    max-parallel: 1
    case-timeout-ms: ${AGENTHUB_EVAL_CASE_TIMEOUT_MS:180000}
    continue-on-case-error: true
    channel: EVAL
    # OpenJudge 软评分 sidecar（默认关；不进 gate_passed）
    openjudge:
      enabled: ${AGENTHUB_EVAL_OPENJUDGE_ENABLED:false}
      required: false
      base-url: ${AGENTHUB_EVAL_OPENJUDGE_BASE_URL:http://127.0.0.1:18765}
      timeout-ms: ${AGENTHUB_EVAL_OPENJUDGE_TIMEOUT_MS:60000}
      default-graders:
        - RelevanceGrader
    # 报告：机读进 DB；可选写 workspace MD
    report:
      write-workspace: ${AGENTHUB_EVAL_REPORT_WRITE_WORKSPACE:true}
      markdown: true
      workspace-dir: ${AGENTHUB_EVAL_REPORT_WORKSPACE:./workspace-test}
    # EvalScope 可选桥（P2）：默认关；仅导出/外触发，不取代 trial、不进 gate
    evalscope:
      enabled: ${AGENTHUB_EVAL_EVALSCOPE_ENABLED:false}
      base-url: ${AGENTHUB_EVAL_EVALSCOPE_BASE_URL:}
      timeout-ms: ${AGENTHUB_EVAL_EVALSCOPE_TIMEOUT_MS:60000}
      export-dir: ${AGENTHUB_EVAL_EVALSCOPE_EXPORT_DIR:./workspace-test}
      note: ""
  # Token 日汇总定时：只扫「今天」，同维覆盖 / 无流水清零，与控制台重算共用 rebuildRange
  billing:
    # 总闸；关则整轮立即返回，不查库
    daily-rollup-enabled: ${AGENTHUB_BILLING_DAILY_ROLLUP_ENABLED:true}
    # Spring cron（含秒）：默认每小时的 10 / 30 / 50 分；时区固定 Asia/Shanghai（见 Job 注解）
    daily-rollup-cron: ${AGENTHUB_BILLING_DAILY_ROLLUP_CRON:0 10,30,50 * * * ?}
    # 定时写入 created_by / updated_by 的系统占位用户 id（非真实登录用户）
    daily-rollup-operator-id: ${AGENTHUB_BILLING_DAILY_ROLLUP_OPERATOR_ID:0}
  security:
    # local | oauth2 | passthrough；后两者本期只保留枚举，不接企业身份
    mode: local
    # 新建用户与重置密码使用的明文，仅开发默认值；生产用环境变量覆盖
    reset-password: ${AGENTHUB_RESET_PASSWORD:admin123}
  cors:
    # 与 Vite 端口一致；5173 被别的前端占用时，本机用 5175。生产改为白名单，不要用 *
    # 生产部署走 nginx 同源反代，跨域白名单通常可以留空
    allowed-origins:
      - https://localhost:5173
      - https://127.0.0.1:5173
      - https://localhost:5175
      - https://127.0.0.1:5175
      # 本地开发仍允许 http，便于 vite dev 不起证书
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:5175
      - http://127.0.0.1:5175
      - http://localhost:8088
      - https://localhost:8443
      - https://127.0.0.1:8443

logging:
  # 相对进程工作目录；logback-spring.xml 按天滚动归档
  file:
    name: logs/agenthub.log
  logback:
    rollingpolicy:
      # 归档保留天数（与 logback-spring.xml springProperty 对齐）
      max-history: 30
      # 单文件上限；同日超出再按 %i 切分
      max-file-size: 100MB
      # 归档总上限
      total-size-cap: 3GB
  level:
    com.agenthub: info

